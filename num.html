body

<script>
let numbers = {
 numb1: "num1.jpg",
numb2 :"num2.jpg",
numb3 :"num3.jpg",
numb4 : "num4.jpg",
numb5: "num5.jpg",
numb6:  "num6.jpg",
numb7:  "num7.jpg",
numb8:  "num8.jpg" ,
numb9:  "num9.jpg",
numb10:  "num10.jpg" 
};

function showInfo(field) {
  let smallImg = document.getElementById("img-" + field);
  smallImg.src = numbers[field];
  smallImg.style.display = "block";}

let num= {
num1: "n1.jpg",
num2 :"n2.jpg",
num3 :"n3.jpg",
num4 : "n4.jpg",
num5: "n5.jpg",
num6:  "n6.jpg",
num7:  "n7.jpg",
num8: "n8.jpg",
num9:  "n9.jpg",
num10: "n10.jpg" ,
};

function fun(field) {
let bigImg = document.getElementById("big-img");
bigImg.src = num[field];
bigImg.style.display = "block";};

function speak( text,lang)
{window.speechSynthesis.cancel();
  let utterance =new SpeechSynthesisUtterance(text);
  if (lang==='ar'){
utterance.lang='ar-EG';
utterance.rate=0.8;}
else { utterance.lang ='en-US';
utterance.rate=0.8;
 };
utterance.pitch=1.2;
window.speechSynthesis.speak(utterance);
};
</script>
